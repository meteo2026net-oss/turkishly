name: Build Sara Turkii Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web for root hosting
        run: flutter build web --release --base-href /

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sara-turkii-web
          path: build/web
          retention-days: 7
