name: Build SARA HOCAM Android (Kotlin)

on:
  push:
    branches:
      - feature/android-kotlin-compose
    paths:
      - "android-kotlin/**"
      - "content/**"
      - ".github/workflows/android-kotlin.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-kotlin/**"
      - "content/**"
      - ".github/workflows/android-kotlin.yml"
  workflow_dispatch:

jobs:
  assemble-debug:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate shared JSON lesson catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("content")
          catalog = json.loads((root / "catalog.json").read_text(encoding="utf-8"))
          seen = set()
          checked = 0
          for unit in catalog["units"]:
              level = unit["level"]
              unit_id = unit["id"]
              for lesson in unit.get("lessons", []):
                  lesson_id = lesson["id"]
                  if lesson_id in seen:
                      raise SystemExit(f"Duplicate lesson id: {lesson_id}")
                  seen.add(lesson_id)
                  path = root / "lessons" / level / unit_id / f"{lesson_id}.json"
                  if not path.is_file():
                      raise SystemExit(f"Missing lesson file: {path}")
                  data = json.loads(path.read_text(encoding="utf-8"))
                  if data.get("id") != lesson_id:
                      raise SystemExit(f"Lesson id mismatch in {path}")
                  checked += 1
          declared = catalog.get("declaredLessonCount")
          if declared is not None and declared != checked:
              raise SystemExit(f"Catalog declares {declared} lessons, found {checked}")
          print(f"Validated {checked} lesson JSON files across {len(catalog['units'])} units.")
          PY

      - name: Build debug APK
        working-directory: android-kotlin
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sara-hocam-android-debug
          path: android-kotlin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
