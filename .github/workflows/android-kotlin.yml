name: Build SARA HOCAM Android (Kotlin)

on:
  push:
    branches:
      - feature/android-kotlin-compose
    paths:
      - "android-kotlin/**"
      - "content/**"
      - ".github/workflows/android-kotlin.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-kotlin/**"
      - "content/**"
      - ".github/workflows/android-kotlin.yml"
  workflow_dispatch:

jobs:
  assemble-debug:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-kotlin
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sara-hocam-android-debug
          path: android-kotlin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
